<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hello-Color ShaderLab 外壳结构" viewBox="0 0 1180 640" width="900" height="488" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-hello-shell" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 25px sans-serif;fill:#0f172a}
      .subtitle{font:13px sans-serif;fill:#64748b}
      .h{font:700 16px sans-serif;fill:#0f172a}
      .t{font:13px sans-serif;fill:#334155}
      .small{font:12px sans-serif;fill:#64748b}
      .outer{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:22}
      .props{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}
      .sub{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:18}
      .pass{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:16}
      .program{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}
      .node{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:12}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow-hello-shell)}
      .dash{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow-hello-shell)}
      .code{font:12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#334155}
    </style>
  </defs>

  <rect width="1180" height="640" class="bg"/>
  <text x="590" y="44" text-anchor="middle" class="title">Hello-Color 的 ShaderLab 外壳</text>
  <text x="590" y="70" text-anchor="middle" class="subtitle">ShaderLab 负责声明资源、选择 SubShader 和组织 Pass；HLSL 只负责可编程阶段里的函数。</text>

  <rect x="48" y="104" width="1084" height="482" class="outer"/>
  <text x="90" y="138" class="h">Shader "ShaderAllInOne/HelloColor"</text>
  <text x="90" y="162" class="small">菜单路径、Fallback 查找和材质引用都从这个名字开始。</text>

  <rect x="92" y="202" width="238" height="126" class="props"/>
  <text x="211" y="236" text-anchor="middle" class="h">Properties</text>
  <text x="122" y="266" class="t">_Color ("Color", Color)</text>
  <text x="122" y="290" class="small">暴露到 Inspector</text>
  <text x="122" y="312" class="small">序列化到 Material</text>

  <rect x="380" y="182" width="686" height="342" class="sub"/>
  <text x="420" y="216" class="h">SubShader</text>
  <text x="420" y="240" class="small">Unity 会按硬件能力、管线和 Tags 选择可用 SubShader。</text>

  <rect x="416" y="274" width="228" height="82" class="node"/>
  <text x="530" y="304" text-anchor="middle" class="h">Tags</text>
  <text x="530" y="330" text-anchor="middle" class="code">"RenderType"="Opaque"</text>

  <rect x="690" y="274" width="318" height="210" class="pass"/>
  <text x="730" y="308" class="h">Pass</text>
  <text x="730" y="332" class="small">一次绘制路径：状态 + 可编程入口。</text>

  <rect x="728" y="362" width="242" height="92" class="program"/>
  <text x="849" y="392" text-anchor="middle" class="h">HLSLPROGRAM</text>
  <text x="758" y="420" class="code">#pragma vertex vert</text>
  <text x="758" y="442" class="code">#pragma fragment frag</text>

  <rect x="92" y="386" width="238" height="104" class="node"/>
  <text x="211" y="416" text-anchor="middle" class="h">Material 面板</text>
  <text x="122" y="444" class="small">用户调色</text>
  <text x="122" y="466" class="small">C# 或 PropertyBlock 覆盖</text>

  <rect x="456" y="394" width="172" height="88" class="node"/>
  <text x="542" y="424" text-anchor="middle" class="h">固定状态</text>
  <text x="542" y="450" text-anchor="middle" class="small">Queue / ZTest / Blend</text>

  <rect x="988" y="362" width="94" height="92" class="node"/>
  <text x="1035" y="394" text-anchor="middle" class="h">GPU</text>
  <text x="1035" y="420" text-anchor="middle" class="small">vert</text>
  <text x="1035" y="442" text-anchor="middle" class="small">frag</text>

  <path d="M330 266 C350 266 358 266 376 266" class="arrow"/>
  <path d="M644 315 L686 315" class="arrow"/>
  <path d="M970 408 L984 408" class="arrow"/>
  <path d="M211 328 L211 382" class="dash"/>
  <path d="M330 438 C382 438 400 438 452 438" class="dash"/>

  <text x="590" y="612" text-anchor="middle" class="small">读代码时先分层：外壳决定“这个 Pass 何时被用”，HLSL 决定“顶点和片元如何计算”。</text>
</svg>
