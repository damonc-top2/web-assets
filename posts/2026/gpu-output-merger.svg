<svg xmlns="http://www.w3.org/2000/svg"  role="img" aria-label="深度测试和颜色混合写入帧缓冲" viewBox="0 0 1000 410" width="800" height="328" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}
      .pass{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:14}
      .drop{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:14}
      .buf{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
      .h{font:700 16px sans-serif;fill:#0f172a}
      .t{font:13px sans-serif;fill:#334155}
      .a{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow5)}
      .red{stroke:#ef4444;stroke-width:2;fill:none;marker-end:url(#arrow5)}
    </style>
  </defs>

  <rect x="40" y="126" width="150" height="82" class="box"/>
  <text x="115" y="158" text-anchor="middle" class="h">Fragment</text>
  <text x="115" y="184" text-anchor="middle" class="t">color + depth</text>

  <rect x="250" y="126" width="150" height="82" class="box"/>
  <text x="325" y="158" text-anchor="middle" class="h">Stencil Test</text>
  <text x="325" y="184" text-anchor="middle" class="t">区域规则</text>

  <rect x="460" y="126" width="150" height="82" class="box"/>
  <text x="535" y="158" text-anchor="middle" class="h">Depth Test</text>
  <text x="535" y="184" text-anchor="middle" class="t">近处覆盖远处</text>

  <rect x="670" y="126" width="150" height="82" class="box"/>
  <text x="745" y="158" text-anchor="middle" class="h">Blend</text>
  <text x="745" y="184" text-anchor="middle" class="t">透明 / 加法</text>

  <rect x="860" y="80" width="110" height="78" class="buf"/>
  <text x="915" y="112" text-anchor="middle" class="h">Color</text>
  <text x="915" y="136" text-anchor="middle" class="t">Buffer</text>

  <rect x="860" y="204" width="110" height="78" class="buf"/>
  <text x="915" y="236" text-anchor="middle" class="h">Depth</text>
  <text x="915" y="260" text-anchor="middle" class="t">Buffer</text>

  <rect x="462" y="270" width="145" height="58" class="drop"/>
  <text x="535" y="304" text-anchor="middle" class="h">Discard</text>

  <path d="M192 167 L246 167" class="a"/>
  <path d="M402 167 L456 167" class="a"/>
  <path d="M612 167 L666 167" class="a"/>
  <path d="M822 150 L856 124" class="a"/>
  <path d="M820 183 L856 230" class="a"/>
  <path d="M535 210 L535 266" class="red"/>
</svg>
