<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="顶点片元 Shader 数据流" viewBox="0 0 1180 520" width="900" height="397" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-vf-pipeline" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 24px sans-serif;fill:#0f172a}
      .subtitle{font:13px sans-serif;fill:#64748b}
      .h{font:700 15px sans-serif;fill:#0f172a}
      .t{font:12px sans-serif;fill:#334155}
      .small{font:12px sans-serif;fill:#64748b}
      .data{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
      .shader{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:16}
      .fixed{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:16}
      .out{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow-vf-pipeline)}
      .thin{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#arrow-vf-pipeline)}
    </style>
  </defs>

  <rect width="1180" height="520" class="bg"/>
  <text x="590" y="42" text-anchor="middle" class="title">顶点-片元：沿着硬件图形管线显式写代码</text>
  <text x="590" y="68" text-anchor="middle" class="subtitle">你负责顶点输出、插值数据和片元颜色；装配、光栅化、深度测试与混合仍由固定功能阶段接管。</text>

  <rect x="46" y="132" width="142" height="80" class="data"/>
  <text x="117" y="163" text-anchor="middle" class="h">Mesh Data</text>
  <text x="117" y="188" text-anchor="middle" class="t">POSITION / UV</text>

  <rect x="232" y="132" width="152" height="80" class="shader"/>
  <text x="308" y="163" text-anchor="middle" class="h">Vertex</text>
  <text x="308" y="188" text-anchor="middle" class="t">Object -> Clip</text>

  <rect x="428" y="132" width="152" height="80" class="fixed"/>
  <text x="504" y="163" text-anchor="middle" class="h">Fixed Stage</text>
  <text x="504" y="188" text-anchor="middle" class="t">Cull / Clip</text>

  <rect x="624" y="132" width="152" height="80" class="fixed"/>
  <text x="700" y="163" text-anchor="middle" class="h">Rasterizer</text>
  <text x="700" y="188" text-anchor="middle" class="t">Fragment + Interp</text>

  <rect x="820" y="132" width="152" height="80" class="shader"/>
  <text x="896" y="163" text-anchor="middle" class="h">Fragment</text>
  <text x="896" y="188" text-anchor="middle" class="t">Texture + Lighting</text>

  <rect x="1016" y="132" width="122" height="80" class="out"/>
  <text x="1077" y="163" text-anchor="middle" class="h">Target</text>
  <text x="1077" y="188" text-anchor="middle" class="t">Color / Depth</text>

  <path d="M190 172 L228 172" class="arrow"/>
  <path d="M386 172 L424 172" class="arrow"/>
  <path d="M582 172 L620 172" class="arrow"/>
  <path d="M778 172 L816 172" class="arrow"/>
  <path d="M974 172 L1012 172" class="arrow"/>

  <rect x="228" y="270" width="160" height="112" class="data"/>
  <text x="308" y="300" text-anchor="middle" class="h">Varyings</text>
  <text x="308" y="326" text-anchor="middle" class="t">uv</text>
  <text x="308" y="348" text-anchor="middle" class="t">normalWS</text>
  <text x="308" y="370" text-anchor="middle" class="t">positionWS</text>

  <rect x="520" y="278" width="150" height="96" class="fixed"/>
  <text x="595" y="310" text-anchor="middle" class="h">Interpolation</text>
  <text x="595" y="336" text-anchor="middle" class="t">透视校正</text>
  <text x="595" y="358" text-anchor="middle" class="t">屏幕采样点</text>

  <rect x="812" y="270" width="168" height="112" class="data"/>
  <text x="896" y="300" text-anchor="middle" class="h">Material Inputs</text>
  <text x="896" y="326" text-anchor="middle" class="t">Texture / Sampler</text>
  <text x="896" y="348" text-anchor="middle" class="t">Constant Buffer</text>
  <text x="896" y="370" text-anchor="middle" class="t">Light Data</text>

  <path d="M308 214 L308 266" class="thin"/>
  <path d="M390 326 C440 326 470 326 516 326" class="thin"/>
  <path d="M672 326 C724 326 760 326 808 326" class="thin"/>
  <path d="M896 266 L896 216" class="thin"/>

  <text x="590" y="456" text-anchor="middle" class="small">性能观察：顶点成本跟顶点数和变形复杂度有关，片元成本跟覆盖面积、纹理采样、过度绘制和带宽有关。</text>
</svg>
