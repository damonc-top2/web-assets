<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CPU GPU Present 采样边界" viewBox="0 0 1180 560" width="900" height="427" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-profile-boundary" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 25px sans-serif;fill:#0f172a}
      .sub{font:13px sans-serif;fill:#64748b}
      .lane{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:16}
      .axis{stroke:#475569;stroke-width:2;marker-end:url(#arrow-profile-boundary)}
      .main{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:10}
      .render{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:10}
      .gpu{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:10}
      .present{fill:#ffedd5;stroke:#f97316;stroke-width:2;rx:10}
      .wait{fill:#fee2e2;stroke:#ef4444;stroke-width:2;stroke-dasharray:7 5;rx:10}
      .h{font:700 15px sans-serif;fill:#0f172a}
      .t{font:12px sans-serif;fill:#334155}
      .small{font:12px sans-serif;fill:#64748b}
      .label{font:700 13px sans-serif;fill:#334155}
      .tick{stroke:#94a3b8;stroke-width:1}
      .link{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}
    </style>
  </defs>

  <rect width="1180" height="560" class="bg"/>
  <text x="590" y="44" text-anchor="middle" class="title">一帧的时间不是一个数：CPU、GPU、Present 有不同采样边界</text>
  <text x="590" y="72" text-anchor="middle" class="sub">Profile Analyzer 擅长聚合 CPU 线程和 marker；GPU 帧时间采样回答 GPU 实际执行与显示同步问题。</text>

  <line x1="150" y1="500" x2="1040" y2="500" class="axis"/>
  <text x="1040" y="528" text-anchor="end" class="label">时间</text>
  <line x1="220" y1="96" x2="220" y2="506" class="tick"/>
  <line x1="420" y1="96" x2="420" y2="506" class="tick"/>
  <line x1="620" y1="96" x2="620" y2="506" class="tick"/>
  <line x1="820" y1="96" x2="820" y2="506" class="tick"/>
  <line x1="1020" y1="96" x2="1020" y2="506" class="tick"/>

  <rect x="98" y="110" width="970" height="74" class="lane"/>
  <text x="126" y="154" class="h">Main Thread</text>
  <rect x="240" y="126" width="190" height="38" class="main"/>
  <text x="335" y="151" text-anchor="middle" class="t">Update / Culling</text>
  <rect x="454" y="126" width="145" height="38" class="main"/>
  <text x="526" y="151" text-anchor="middle" class="t">Build Render List</text>
  <rect x="620" y="126" width="118" height="38" class="wait"/>
  <text x="679" y="151" text-anchor="middle" class="t">Wait Render</text>

  <rect x="98" y="214" width="970" height="74" class="lane"/>
  <text x="126" y="258" class="h">Render Thread</text>
  <rect x="332" y="230" width="218" height="38" class="render"/>
  <text x="441" y="255" text-anchor="middle" class="t">Submit Draw / SetPass</text>
  <rect x="568" y="230" width="178" height="38" class="render"/>
  <text x="657" y="255" text-anchor="middle" class="t">Command Buffer</text>
  <rect x="766" y="230" width="138" height="38" class="present"/>
  <text x="835" y="255" text-anchor="middle" class="t">Present</text>
  <rect x="912" y="230" width="92" height="38" class="wait"/>
  <text x="958" y="255" text-anchor="middle" class="t">VSync</text>

  <rect x="98" y="318" width="970" height="74" class="lane"/>
  <text x="126" y="362" class="h">GPU Queue</text>
  <rect x="430" y="334" width="132" height="38" class="gpu"/>
  <text x="496" y="359" text-anchor="middle" class="t">Vertex</text>
  <rect x="572" y="334" width="166" height="38" class="gpu"/>
  <text x="655" y="359" text-anchor="middle" class="t">Fragment / Texture</text>
  <rect x="748" y="334" width="112" height="38" class="gpu"/>
  <text x="804" y="359" text-anchor="middle" class="t">ROP / Blend</text>

  <rect x="98" y="422" width="970" height="54" class="lane"/>
  <text x="126" y="454" class="h">Display</text>
  <rect x="790" y="432" width="206" height="26" class="present"/>
  <text x="893" y="450" text-anchor="middle" class="t">Scanout / Frame Pacing</text>

  <path d="M600 164 C634 182 676 210 734 230" class="link"/>
  <path d="M746 268 C730 292 708 314 686 334" class="link"/>
  <path d="M860 372 C872 394 884 414 894 432" class="link"/>

  <rect x="246" y="82" width="222" height="28" fill="#e0f2fe" stroke="#38bdf8" rx="12"/>
  <text x="357" y="101" text-anchor="middle" class="small">Profile Analyzer: marker 分布、均值、中位数、分位、对比</text>
  <rect x="542" y="398" width="294" height="28" fill="#dcfce7" stroke="#22c55e" rx="12"/>
  <text x="689" y="417" text-anchor="middle" class="small">GPU frame time: GPU timestamp / FrameTiming 采样</text>
  <rect x="778" y="190" width="246" height="28" fill="#ffedd5" stroke="#fb923c" rx="12"/>
  <text x="901" y="209" text-anchor="middle" class="small">Present/VSync: 可能是等待，不等于 Shader 成本</text>
</svg>
