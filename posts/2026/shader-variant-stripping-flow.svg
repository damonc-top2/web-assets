<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Shader variant stripping and runtime warmup</title>
  <desc id="desc">Build-time stripping removes unused variants, then runtime loading and warmup prepare the remaining variants.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9FBEF"/>
      <stop offset="100%" stop-color="#BFF0D0"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #F8FAFC; }
      .stage { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#shadow); }
      .src { fill: url(#blue); stroke: #60A5FA; stroke-width: 1.4; }
      .strip { fill: url(#red); stroke: #FB7185; stroke-width: 1.4; }
      .keep { fill: url(#green); stroke: #34D399; stroke-width: 1.4; }
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .muted { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .code { font: 700 15px "SFMono-Regular", Consolas, monospace; fill: #1E293B; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94A3B8; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="920" height="560" rx="28"/>
  <text class="title" x="44" y="54">Stripping 发生在构建期，Warmup 发生在运行期</text>
  <text class="text" x="44" y="82">裁剪决定哪些变体被打进包；预热只影响剩余变体第一次使用时是否卡顿。</text>

  <rect class="stage" x="48" y="124" width="188" height="118" rx="22"/>
  <text class="label" x="80" y="158">Shader 源码</text>
  <text class="code" x="72" y="190">#pragma multi_compile</text>
  <text class="code" x="72" y="216">#pragma shader_feature</text>

  <line class="arrow" x1="248" y1="183" x2="308" y2="183"/>

  <rect class="stage" x="320" y="124" width="188" height="118" rx="22"/>
  <text class="label" x="357" y="158">候选变体</text>
  <text class="text" x="350" y="190">关键字组合</text>
  <text class="text" x="350" y="216">Pass / 平台 / 管线</text>

  <line class="arrow" x1="520" y1="183" x2="580" y2="183"/>

  <rect class="stage" x="592" y="124" width="280" height="118" rx="22"/>
  <text class="label" x="643" y="158">构建期 Stripping</text>
  <text class="text" x="622" y="190">根据材质引用、管线设置、图形 API、脚本规则删除无用组合</text>
  <text class="muted" x="622" y="218">删除后，运行时无法凭空恢复</text>

  <rect class="strip" x="100" y="318" width="208" height="96" rx="20"/>
  <text class="label" x="144" y="354">被裁掉</text>
  <text class="text" x="122" y="384">包体和编译成本下降</text>

  <rect class="keep" x="356" y="318" width="208" height="96" rx="20"/>
  <text class="label" x="408" y="354">被保留</text>
  <text class="text" x="386" y="384">随包或 AssetBundle 分发</text>

  <rect class="src" x="612" y="318" width="208" height="96" rx="20"/>
  <text class="label" x="661" y="354">运行时</text>
  <text class="text" x="636" y="384">加载、选择、可能触发编译</text>

  <path class="dash" d="M732 248 C734 286 710 300 716 318"/>
  <path class="arrow" d="M458 248 C460 284 460 290 460 316"/>
  <path class="arrow" d="M564 366 L600 366"/>

  <rect class="stage" x="186" y="454" width="548" height="58" rx="18"/>
  <text class="label" x="218" y="490">ShaderVariantCollection</text>
  <text class="text" x="442" y="490">记录并预热“已存在”的变体，不是万能保留清单。</text>
</svg>
