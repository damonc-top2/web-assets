<svg xmlns="http://www.w3.org/2000/svg"  role="img" aria-label="三角形光栅化生成片元" viewBox="0 0 880 430" width="800" height="391" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .grid{stroke:#cbd5e1;stroke-width:1}
      .tri{fill:#60a5fa;fill-opacity:0.28;stroke:#2563eb;stroke-width:3}
      .dot{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1}
      .hit{fill:#2563eb;stroke:#1d4ed8;stroke-width:1}
      .label{font:14px sans-serif;fill:#334155}
      .head{font:700 18px sans-serif;fill:#0f172a}
      .uv{font:12px monospace;fill:#0f172a}
    </style>
  </defs>

  <text x="440" y="38" text-anchor="middle" class="head">Rasterization：三角形覆盖测试 + 属性插值</text>

  <g transform="translate(90,70)">
    <rect x="0" y="0" width="360" height="280" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g>
      <path d="M40 0 V280 M80 0 V280 M120 0 V280 M160 0 V280 M200 0 V280 M240 0 V280 M280 0 V280 M320 0 V280" class="grid"/>
      <path d="M0 40 H360 M0 80 H360 M0 120 H360 M0 160 H360 M0 200 H360 M0 240 H360" class="grid"/>
    </g>
    <polygon points="70,230 295,205 195,45" class="tri"/>
    <g>
      <circle cx="60" cy="220" r="5" class="hit"/>
      <circle cx="100" cy="220" r="5" class="hit"/>
      <circle cx="140" cy="220" r="5" class="hit"/>
      <circle cx="180" cy="220" r="5" class="hit"/>
      <circle cx="220" cy="220" r="5" class="hit"/>
      <circle cx="260" cy="220" r="5" class="hit"/>
      <circle cx="100" cy="180" r="5" class="hit"/>
      <circle cx="140" cy="180" r="5" class="hit"/>
      <circle cx="180" cy="180" r="5" class="hit"/>
      <circle cx="220" cy="180" r="5" class="hit"/>
      <circle cx="260" cy="180" r="5" class="hit"/>
      <circle cx="140" cy="140" r="5" class="hit"/>
      <circle cx="180" cy="140" r="5" class="hit"/>
      <circle cx="220" cy="140" r="5" class="hit"/>
      <circle cx="180" cy="100" r="5" class="hit"/>
      <circle cx="220" cy="100" r="5" class="hit"/>
      <circle cx="180" cy="60" r="5" class="hit"/>
    </g>
    <g opacity="0.65">
      <circle cx="20" cy="20" r="4" class="dot"/>
      <circle cx="60" cy="20" r="4" class="dot"/>
      <circle cx="100" cy="20" r="4" class="dot"/>
      <circle cx="300" cy="60" r="4" class="dot"/>
      <circle cx="320" cy="220" r="4" class="dot"/>
      <circle cx="60" cy="100" r="4" class="dot"/>
      <circle cx="300" cy="140" r="4" class="dot"/>
    </g>
    <text x="74" y="248" class="uv">v0</text>
    <text x="300" y="210" class="uv">v1</text>
    <text x="200" y="42" class="uv">v2</text>
  </g>

  <g transform="translate(535,96)">
    <text x="0" y="0" class="label">每个蓝点代表一个被覆盖的采样点。</text>
    <text x="0" y="34" class="label">硬件会为它生成 Fragment：</text>
    <rect x="0" y="58" width="260" height="150" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="12"/>
    <text x="22" y="92" class="uv">screen = (x, y)</text>
    <text x="22" y="122" class="uv">depth  = z</text>
    <text x="22" y="152" class="uv">uv     = lerp(v0,v1,v2)</text>
    <text x="22" y="182" class="uv">normal = lerp(n0,n1,n2)</text>
    <text x="0" y="252" class="label">这些插值数据会进入 Fragment Shader。</text>
  </g>
</svg>
