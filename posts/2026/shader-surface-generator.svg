<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Surface Shader 编译生成 Pass" viewBox="0 0 1180 540" width="900" height="412" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-surface-generator" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 24px sans-serif;fill:#0f172a}
      .subtitle{font:13px sans-serif;fill:#64748b}
      .h{font:700 15px sans-serif;fill:#0f172a}
      .t{font:12px sans-serif;fill:#334155}
      .small{font:12px sans-serif;fill:#64748b}
      .code{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:16}
      .compiler{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:20}
      .pass{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
      .limit{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:14}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow-surface-generator)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow-surface-generator)}
    </style>
  </defs>

  <rect width="1180" height="540" class="bg"/>
  <text x="590" y="44" text-anchor="middle" class="title">Surface Shader：把“表面属性”交给 Unity 生成光照代码</text>
  <text x="590" y="70" text-anchor="middle" class="subtitle">它是 Built-in 管线里的高层写法，适合快速接入传统 Forward / Deferred / Shadow Pass。</text>

  <rect x="64" y="150" width="260" height="178" class="code"/>
  <text x="194" y="184" text-anchor="middle" class="h">你写的部分</text>
  <text x="102" y="220" class="t">#pragma surface surf Standard</text>
  <text x="102" y="248" class="t">surf(Input IN, inout SurfaceOutputStandard o)</text>
  <text x="102" y="276" class="t">o.Albedo / o.Normal / o.Metallic</text>
  <text x="102" y="304" class="t">可选 vertex:vert / alpha / addshadow</text>

  <rect x="462" y="154" width="256" height="170" class="compiler"/>
  <text x="590" y="190" text-anchor="middle" class="h">Surface Compiler</text>
  <text x="590" y="222" text-anchor="middle" class="t">推导输入语义</text>
  <text x="590" y="248" text-anchor="middle" class="t">生成 Vertex / Fragment</text>
  <text x="590" y="274" text-anchor="middle" class="t">接入内置光照与阴影</text>
  <text x="590" y="300" text-anchor="middle" class="t">按变体生成多个 Pass</text>

  <path d="M326 238 L458 238" class="arrow"/>

  <rect x="856" y="94" width="236" height="58" class="pass"/>
  <text x="974" y="130" text-anchor="middle" class="h">ForwardBase</text>
  <rect x="856" y="176" width="236" height="58" class="pass"/>
  <text x="974" y="212" text-anchor="middle" class="h">ForwardAdd</text>
  <rect x="856" y="258" width="236" height="58" class="pass"/>
  <text x="974" y="294" text-anchor="middle" class="h">Deferred / GBuffer</text>
  <rect x="856" y="340" width="236" height="58" class="pass"/>
  <text x="974" y="376" text-anchor="middle" class="h">ShadowCaster / Meta</text>

  <path d="M720 200 C768 152 806 126 852 124" class="arrow"/>
  <path d="M720 226 C766 220 808 208 852 206" class="arrow"/>
  <path d="M720 256 C766 276 808 288 852 288" class="arrow"/>
  <path d="M720 286 C768 334 806 366 852 370" class="arrow"/>

  <rect x="388" y="390" width="404" height="70" class="limit"/>
  <text x="590" y="418" text-anchor="middle" class="h">边界</text>
  <text x="590" y="444" text-anchor="middle" class="small">Surface Shader 不进入 URP / HDRP 主路径；新 SRP 项目更应使用 Shader Graph 或手写 HLSL Pass。</text>
  <path d="M590 326 L590 386" class="dash"/>
</svg>
