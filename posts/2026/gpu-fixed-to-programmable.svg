<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="固定管线到可编程管线的控制边界变化" viewBox="0 0 1100 520" width="900" height="425" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-fixed-programmable" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:18}
      .fixed{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:12}
      .prog{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}
      .out{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}
      .title{font:700 22px sans-serif;fill:#0f172a}
      .h{font:700 15px sans-serif;fill:#0f172a}
      .t{font:13px sans-serif;fill:#334155}
      .muted{font:12px sans-serif;fill:#64748b}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow-fixed-programmable)}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6;fill:none}
    </style>
  </defs>

  <rect width="1100" height="520" class="bg"/>
  <text x="550" y="44" text-anchor="middle" class="title">控制边界：从固定状态到 Shader 程序</text>

  <rect x="52" y="82" width="468" height="332" class="panel"/>
  <text x="286" y="118" text-anchor="middle" class="h">Fixed-Function Pipeline</text>
  <text x="286" y="142" text-anchor="middle" class="muted">开发者配置状态，算法路径由 API / 硬件预设</text>

  <rect x="86" y="178" width="100" height="64" class="fixed"/>
  <text x="136" y="205" text-anchor="middle" class="h">Transform</text>
  <text x="136" y="225" text-anchor="middle" class="t">矩阵状态</text>

  <rect x="210" y="178" width="100" height="64" class="fixed"/>
  <text x="260" y="205" text-anchor="middle" class="h">Lighting</text>
  <text x="260" y="225" text-anchor="middle" class="t">固定光照</text>

  <rect x="334" y="178" width="120" height="64" class="fixed"/>
  <text x="394" y="205" text-anchor="middle" class="h">Texture Stage</text>
  <text x="394" y="225" text-anchor="middle" class="t">纹理组合</text>

  <rect x="210" y="290" width="120" height="64" class="out"/>
  <text x="270" y="317" text-anchor="middle" class="h">Framebuffer</text>
  <text x="270" y="337" text-anchor="middle" class="t">颜色 / 深度</text>

  <path d="M186 210 L206 210" class="arrow"/>
  <path d="M310 210 L330 210" class="arrow"/>
  <path d="M394 244 C394 276 346 294 334 314" class="arrow"/>
  <path d="M136 244 C136 286 188 304 206 318" class="arrow"/>

  <rect x="580" y="82" width="468" height="332" class="panel"/>
  <text x="814" y="118" text-anchor="middle" class="h">Programmable Pipeline</text>
  <text x="814" y="142" text-anchor="middle" class="muted">稳定阶段保留固定硬件，变化阶段交给 Shader</text>

  <rect x="612" y="178" width="110" height="64" class="prog"/>
  <text x="667" y="205" text-anchor="middle" class="h">Vertex Shader</text>
  <text x="667" y="225" text-anchor="middle" class="t">顶点程序</text>

  <rect x="748" y="178" width="110" height="64" class="fixed"/>
  <text x="803" y="205" text-anchor="middle" class="h">Rasterizer</text>
  <text x="803" y="225" text-anchor="middle" class="t">固定吞吐</text>

  <rect x="884" y="178" width="118" height="64" class="prog"/>
  <text x="943" y="205" text-anchor="middle" class="h">Pixel Shader</text>
  <text x="943" y="225" text-anchor="middle" class="t">材质 / 光照</text>

  <rect x="684" y="290" width="110" height="64" class="prog"/>
  <text x="739" y="317" text-anchor="middle" class="h">Compute</text>
  <text x="739" y="337" text-anchor="middle" class="t">通用并行</text>

  <rect x="840" y="290" width="120" height="64" class="out"/>
  <text x="900" y="317" text-anchor="middle" class="h">Render Targets</text>
  <text x="900" y="337" text-anchor="middle" class="t">颜色 / 深度 / Buffer</text>

  <path d="M724 210 L744 210" class="arrow"/>
  <path d="M860 210 L880 210" class="arrow"/>
  <path d="M943 244 C943 270 924 284 912 288" class="arrow"/>
  <path d="M794 322 L836 322" class="arrow"/>
  <path d="M739 288 C748 264 766 250 790 242" class="dash"/>

  <text x="286" y="456" text-anchor="middle" class="muted">固定管线：算法入口被封装成状态</text>
  <text x="814" y="456" text-anchor="middle" class="muted">可编程管线：算法入口暴露给 Shader / 引擎</text>
</svg>
