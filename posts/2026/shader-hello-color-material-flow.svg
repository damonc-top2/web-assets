<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hello-Color 材质属性进入 GPU 的路径" viewBox="0 0 1180 620" width="900" height="473" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow-hello-flow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 25px sans-serif;fill:#0f172a}
      .subtitle{font:13px sans-serif;fill:#64748b}
      .h{font:700 16px sans-serif;fill:#0f172a}
      .t{font:13px sans-serif;fill:#334155}
      .small{font:12px sans-serif;fill:#64748b}
      .cpu{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}
      .unity{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:16}
      .gpu{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:16}
      .fixed{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:16}
      .target{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:16}
      .note{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:12}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow-hello-flow)}
      .thin{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#arrow-hello-flow)}
      .code{font:12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#334155}
    </style>
  </defs>

  <rect width="1180" height="620" class="bg"/>
  <text x="590" y="44" text-anchor="middle" class="title">从 Material._Color 到 Fragment 输出</text>
  <text x="590" y="70" text-anchor="middle" class="subtitle">Properties 只是声明入口；真正绘制时，Unity 会把材质值绑定成 GPU 可读的 uniform / constant 数据。</text>

  <rect x="54" y="140" width="170" height="110" class="cpu"/>
  <text x="139" y="174" text-anchor="middle" class="h">Material Asset</text>
  <text x="84" y="204" class="code">_Color = (1,.35,.2,1)</text>
  <text x="84" y="228" class="small">Inspector 序列化值</text>

  <rect x="274" y="140" width="178" height="110" class="cpu"/>
  <text x="363" y="174" text-anchor="middle" class="h">CPU 覆盖</text>
  <text x="304" y="204" class="code">SetColor</text>
  <text x="304" y="228" class="code">PropertyBlock</text>

  <rect x="504" y="128" width="200" height="134" class="unity"/>
  <text x="604" y="164" text-anchor="middle" class="h">Unity Draw Setup</text>
  <text x="534" y="194" class="small">匹配 Shader 属性名</text>
  <text x="534" y="218" class="small">准备 Mesh / Pass / State</text>
  <text x="534" y="242" class="small">上传本次绘制常量</text>

  <rect x="756" y="128" width="184" height="134" class="gpu"/>
  <text x="848" y="164" text-anchor="middle" class="h">GPU 常量区</text>
  <text x="786" y="194" class="code">float4 _Color;</text>
  <text x="786" y="218" class="small">按 Pass 绑定</text>
  <text x="786" y="242" class="small">Fragment 可直接读取</text>

  <rect x="992" y="140" width="136" height="110" class="target"/>
  <text x="1060" y="174" text-anchor="middle" class="h">Color Target</text>
  <text x="1022" y="204" class="small">通过测试后写入</text>
  <text x="1022" y="228" class="small">帧缓冲颜色</text>

  <path d="M226 195 L270 195" class="arrow"/>
  <path d="M454 195 L500 195" class="arrow"/>
  <path d="M706 195 L752 195" class="arrow"/>
  <path d="M942 195 L988 195" class="arrow"/>

  <rect x="198" y="358" width="168" height="102" class="gpu"/>
  <text x="282" y="392" text-anchor="middle" class="h">Vertex</text>
  <text x="228" y="422" class="code">UnityObjectToClipPos</text>
  <text x="228" y="446" class="small">输出 SV_POSITION</text>

  <rect x="440" y="358" width="168" height="102" class="fixed"/>
  <text x="524" y="392" text-anchor="middle" class="h">Rasterizer</text>
  <text x="470" y="422" class="small">三角形覆盖</text>
  <text x="470" y="446" class="small">生成片元</text>

  <rect x="682" y="358" width="168" height="102" class="gpu"/>
  <text x="766" y="392" text-anchor="middle" class="h">Fragment</text>
  <text x="712" y="422" class="code">return _Color;</text>
  <text x="712" y="446" class="small">输出 SV_Target</text>

  <path d="M366 409 L436 409" class="arrow"/>
  <path d="M608 409 L678 409" class="arrow"/>
  <path d="M848 262 C848 318 812 326 786 354" class="thin"/>
  <path d="M850 409 C930 409 1006 332 1048 254" class="thin"/>

  <rect x="68" y="500" width="1044" height="54" class="note"/>
  <text x="590" y="524" text-anchor="middle" class="h">关键约束：Properties 里的名字、HLSL 变量名、C# 设置名必须一致。</text>
  <text x="590" y="546" text-anchor="middle" class="small">如果材质面板能改色但画面不变，优先检查变量名、Pass 是否被当前管线执行、材质是否真的绑定到 Renderer。</text>
</svg>
